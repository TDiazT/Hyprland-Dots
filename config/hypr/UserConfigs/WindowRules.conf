# LAYER RULES
layerrule {
  name = blur-rofi
  match:namespace = rofi
  blur = on
}
layerrule {
  name = ignorezero-rofi
  match:namespace = rofi
  ignore_alpha = 0
}
layerrule {
  name = blur-notifications
  match:namespace = notifications
  blur = on
}
layerrule {
  name = ignorezero-notifications
  match:namespace = notifications
  ignore_alpha = 0
}
layerrule {
  name = blur-quickshell-overview
  match:namespace = quickshell:overview
  blur = on
}
layerrule {
  name = ignore-alpha-quickshell-overview
  match:namespace = quickshell:overview
  ignore_alpha = 0.5
}

