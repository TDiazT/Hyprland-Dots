# For window rules and layerrules
# See https://wiki.hypr.land/Configuring/Basics/Window-Rules/ for more

# NOTAS: sintaxis de bloque, requiere Hyprland >= 0.53
#   windowrule {
#     name = <identificador unico, OBLIGATORIO y debe ir primero>
#     match:class = ^(regex)$     # todos los match: deben cumplirse (AND)
#     float = on                  # propiedades a aplicar
#   }
# El formato viejo de una linea (windowrule = float, class:...) ya no funciona.

# note for ja: This should NOT be implemented on Debian and Ubuntu

# windowrule - tags - add apps under appropriate tag to use the same settings
# browser tags
windowrule {
  name = tag-browser-firefox
  match:class = ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
  tag = +browser
}
windowrule {
  name = tag-browser-google-chrome-beta
  match:class = ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
  tag = +browser
}
# Chrome PWAs
windowrule {
  name = tag-browser-chrome-default
  match:class = ^(chrome-.+-Default)$
  tag = +browser
}
windowrule {
  name = tag-browser-chromium
  match:class = ^([Cc]hromium)$
  tag = +browser
}
windowrule {
  name = tag-browser-microsoft-edge-stable
  match:class = ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
  tag = +browser
}
windowrule {
  name = tag-browser-brave-browser-beta
  match:class = ^(Brave-browser(-beta|-dev|-unstable)?)$
  tag = +browser
}
windowrule {
  name = tag-browser-thorium-browser
  match:class = ^([Tt]horium-browser|[Cc]achy-browser)$
  tag = +browser
}
windowrule {
  name = tag-browser-zen-alpha
  match:class = ^(zen-alpha|zen)$
  tag = +browser
}

# notif tags
windowrule {
  name = tag-notif-swaync-control-center
  match:class = ^(swaync-control-center|swaync-notification-window|swaync-client|class)$
